<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Not found — Andrew Possehl</title>
		<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
		<link rel="icon" href="/assets/img/favicon.png" type="image/png" sizes="32x32">
		<link rel="stylesheet" type="text/css" href="/assets/css/main.css" media="screen" />
	</head>
	<body>
		<main class="content">
			<div class="mark">
				<svg viewBox="0 0 48 8" width="48" height="8" fill="none">
					<path d="M2,4 C10,2 14,6 22,4 C30,2 34,6 46,4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
				</svg>
			</div>
			<div class="intro">
				<h1 class="bio">Page not found. <a href="/" style="color: var(--text-primary); font-weight: 600;">Go home</a>.</h1>
			</div>
		</main>
		<script>
			const root = document.documentElement;
			const saved = localStorage.getItem('theme');
			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (saved) root.setAttribute('data-theme', saved);
			else if (prefersDark) root.setAttribute('data-theme', 'dark');
		</script>
	</body>
</html>
